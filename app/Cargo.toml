[package]
name = "vectorcut-app"
description = "VectorCut: cut SVG designs on a Silhouette cutter (desktop app on the ArtCraft framework)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "VectorCut"
path = "src/main.rs"

[dependencies]
vectorcut-core = { workspace = true }
vectorcut-usb = { workspace = true }
craft = { workspace = true, features = ["ui-app", "dialogs"] }
raw-window-handle = "0.6"
log = { workspace = true }

[dev-dependencies]
# The headless UI fixture, for tests that click through the settings panel.
craft = { workspace = true, features = ["ui-app", "dialogs", "screen-testing"] }

[lints]
workspace = true
